<svg xmlns="http://www.w3.org/2000/svg" width="640" height="224" viewBox="0 0 640 224" role="img" aria-label="terminal">
  <defs>
    <style>
      .term { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, monospace; }
      .p    { fill: #58a6ff; }
      .c    { fill: #e6edf3; }
      .o    { fill: #58a6ff; }
    </style>
  </defs>

  <rect x="0" y="0" width="640" height="224" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="640" height="28" rx="8" fill="#161b22"/>
  <rect x="0" y="14" width="640" height="14" fill="#161b22"/>
  <rect x="0" y="27" width="640" height="2" fill="#58a6ff"/>
  <text x="16" y="19" class="term o" font-size="13">gokul@linux: ~</text>
  <text x="624" y="19" class="term o" font-size="13" text-anchor="end">bash</text>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.03;0.04;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="56" class="term p" font-size="16">gokul@linux:~/work$</text>
    <text x="204" y="56" class="term c" font-size="16">whoami</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.11;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="82" class="term o" font-size="16">gokul</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.19;0.20;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="108" class="term p" font-size="16">gokul@linux:~/work$</text>
    <text x="204" y="108" class="term c" font-size="16">go build -o server ./cmd</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.28;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="134" class="term p" font-size="16">[OK] compiled in 0.41s</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.37;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="160" class="term p" font-size="16">gokul@linux:~/work$</text>
    <text x="204" y="160" class="term c" font-size="16">cat profile.txt</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.46;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="186" class="term p" font-size="16" font-weight="bold">Systems &amp; Backend Engineer</text>
  </g>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.55;0.94;1" dur="14s" repeatCount="indefinite"/>
    <text x="16" y="212" class="term c" font-size="16">█
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite" begin="7.6s"/>
    </text>
  </g>
</svg>
